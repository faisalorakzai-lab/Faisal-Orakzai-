kind = "web"
previewPath = "/"
title = "ORAKSER — Orakzai Services"
version = "1.0.0"
id = "artifacts/orakser"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23155

[services.development]
run = "pnpm --filter @workspace/orakser run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orakser", "run", "build" ]
publicDir = "artifacts/orakser/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23155"
BASE_PATH = "/"
